[package]
name = "js2rhino"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = "1.0.229"
serde_json = "1.0.145"

anyhow = "1.0.104"
indicatif = "0.18.6"
rayon = "1.12.0"


swc = "78.0.1"
swc_common = { version = "26.0.0", features = ["sourcemap"] }
swc_ecma_ast = "29.0.2"
swc_ecma_parser = "45.1.5"
swc_ecma_transforms_typescript = "55.0.4"
swc_ecma_transforms_compat = "57.0.3"
swc_ecma_transforms_base = { version = "49.0.1", features = ["inline-helpers"] }
swc_ecma_preset_env = "65.0.0"
swc_ecma_visit = "29.0.0"
swc_bundler = "56.0.1"
swc_ecma_loader = { version = "27.0.0", features = ["node"] }
